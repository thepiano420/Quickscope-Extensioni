<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    
    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 16px;
    }
    
    .stat-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    
    .stat-number {
      font-size: 48px;
      font-weight: bold;
      color: #ef4444;
      line-height: 1;
      margin-bottom: 8px;
    }
    
    .stat-label {
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
    }
    
    .severity-breakdown {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    
    .severity-breakdown h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }
    
    .severity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    
    .severity-item:last-child {
      border-bottom: none;
    }
    
    .severity-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    
    .severity-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .dot-low { background: #eab308; }
    .dot-medium { background: #f97316; }
    .dot-high { background: #ef4444; }
    .dot-critical { background: #991b1b; }
    
    .severity-count {
      font-weight: 600;
      font-size: 16px;
    }
    
    .patterns-section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .patterns-section h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }
    
    .pattern-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .pattern-item {
      padding: 10px;
      border-left: 3px solid #ef4444;
      margin-bottom: 8px;
      background: #fef2f2;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .pattern-type {
      font-weight: 600;
      color: #991b1b;
      margin-bottom: 4px;
    }
    
    .pattern-text {
      color: #6b7280;
      font-size: 11px;
    }
    
    .no-patterns {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
      font-size: 13px;
    }
    
    .footer {
      padding: 12px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 QuickScope v2.0</h1>
    <p>Dark Pattern Detector</p>
  </div>
  
  <div class="content">
    <div class="stat-box">
      <div class="stat-number" id="count">0</div>
      <div class="stat-label">Dark Patterns Detected</div>
    </div>
    
    <div class="severity-breakdown">
      <h3>Severity Breakdown</h3>
      <div class="severity-item">
        <div class="severity-label">
          <div class="severity-dot dot-critical"></div>
          <span>Critical</span>
        </div>
        <div class="severity-count" id="critical-count">0</div>
      </div>
      <div class="severity-item">
        <div class="severity-label">
          <div class="severity-dot dot-high"></div>
          <span>High</span>
        </div>
        <div class="severity-count" id="high-count">0</div>
      </div>
      <div class="severity-item">
        <div class="severity-label">
          <div class="severity-dot dot-medium"></div>
          <span>Medium</span>
        </div>
        <div class="severity-count" id="medium-count">0</div>
      </div>
      <div class="severity-item">
        <div class="severity-label">
          <div class="severity-dot dot-low"></div>
          <span>Low</span>
        </div>
        <div class="severity-count" id="low-count">0</div>
      </div>
    </div>
    
    <div class="patterns-section">
      <h2>Detected Patterns</h2>
      <div class="pattern-list" id="patterns">
        <div class="no-patterns">No patterns detected on this page</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    Hover over highlighted elements for details
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
